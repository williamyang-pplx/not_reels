# fly.toml app configuration file for not-brainrot
app = 'not-brainrot'
primary_region = 'ams'

[build]

# Reddit posts: Redlib runs in the same machine on loopback (scripts/fly-start.sh). The REDLIB_DEFAULT_* values
# are Redlib's default settings for every visitor. For a throwaway account's session, use
# `fly secrets set REDLIB_REDDIT_COOKIE=...` (never put it here).
[env]
  REDLIB_URL = 'http://127.0.0.1:8080'
  REDLIB_DEFAULT_THEME = 'black'
  REDLIB_DEFAULT_LAYOUT = 'card'
  REDLIB_DEFAULT_HIDE_SIDEBAR_AND_SUMMARY = 'on'
  REDLIB_DEFAULT_FIXED_NAVBAR = 'off'
  REDLIB_DEFAULT_USE_HLS = 'on'
  REDLIB_DEFAULT_HIDE_HLS_NOTIFICATION = 'on'
  REDLIB_DEFAULT_DISABLE_VISIT_REDDIT_CONFIRMATION = 'on'
  REDLIB_DEFAULT_BLUR_NSFW = 'on'
  REDLIB_ROBOTS_DISABLE_INDEXING = 'on'
  # Refresh reads each subreddit's posts (with every image and video) from Redlib's RSS output.
  REDLIB_ENABLE_RSS = 'on'

[[mounts]]
  source = 'data'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# Two shared CPUs and 1 GB: the server runs Node, Redlib and sharp (shrinking Reddit images) side by side.
[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory = '1gb'
